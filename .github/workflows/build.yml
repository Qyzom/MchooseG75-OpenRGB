name: Build & Release OpenRGB Plugins

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-linux-qt6:
    name: Build Linux Plugin (Qt 6 .so)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout OpenRGB Headers & Submodules
        run: |
          git clone --recursive --depth 1 https://github.com/CalcProgrammer1/OpenRGB.git openrgb_src

      - name: Install Build Dependencies (Qt 6)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-tools-dev libhidapi-dev

      - name: Build Plugin Shared Library
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Rename Linux Plugin
        run: |
          cp build/libOpenRGBMchoseG75Plugin.so OpenRGBMchoseG75Plugin.so
          cp build/libOpenRGBMchoseG75Plugin.so OpenRGBMchoseG75Plugin-Qt6.so

      - name: Upload Linux Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBMchoseG75Plugin-Linux-Qt6
          path: |
            OpenRGBMchoseG75Plugin.so
            OpenRGBMchoseG75Plugin-Qt6.so

  build-linux-qt5:
    name: Build Linux Plugin (Qt 5 .so)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout OpenRGB Headers & Submodules
        run: |
          git clone --recursive --depth 1 https://github.com/CalcProgrammer1/OpenRGB.git openrgb_src

      - name: Install Build Dependencies (Qt 5)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qtbase5-dev qttools5-dev-tools libhidapi-dev

      - name: Build Plugin Shared Library
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Rename Linux Plugin
        run: |
          cp build/libOpenRGBMchoseG75Plugin.so OpenRGBMchoseG75Plugin-Qt5.so

      - name: Upload Linux Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBMchoseG75Plugin-Linux-Qt5
          path: OpenRGBMchoseG75Plugin-Qt5.so

  build-windows:
    name: Build Windows Plugin (.dll)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout OpenRGB Headers & Submodules
        run: |
          git clone --recursive --depth 1 https://github.com/CalcProgrammer1/OpenRGB.git openrgb_src

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Build Plugin Dynamic Library
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Copy Windows Plugin
        run: |
          copy build\Release\OpenRGBMchoseG75Plugin.dll OpenRGBMchoseG75Plugin.dll

      - name: Upload Windows Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBMchoseG75Plugin-Windows
          path: OpenRGBMchoseG75Plugin.dll

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux-qt6, build-linux-qt5, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Qt6 Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenRGBMchoseG75Plugin-Linux-Qt6
          path: release_assets

      - name: Download Linux Qt5 Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenRGBMchoseG75Plugin-Linux-Qt5
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenRGBMchoseG75Plugin-Windows
          path: release_assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
