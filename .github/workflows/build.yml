name: Build & Release OpenRGB Plugins

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-linux-qt6:
    name: Build Linux Plugins (Qt 6 .so)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout OpenRGB Headers & Submodules
        run: |
          git clone --recursive --depth 1 https://github.com/CalcProgrammer1/OpenRGB.git openrgb_src

      - name: Install Build Dependencies (Qt 6)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-tools-dev libhidapi-dev

      - name: Build Plugins Shared Libraries
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)

      - name: Copy Linux Plugins
        run: |
          cp build/OpenRGBMchoseG75WiredPlugin.so OpenRGBMchoseG75WiredPlugin.so
          cp build/OpenRGBMchoseG75WirelessPlugin.so OpenRGBMchoseG75WirelessPlugin.so
          cp build/OpenRGBMchoseG75Plugin.so OpenRGBMchoseG75Plugin.so

      - name: Upload Linux Plugins Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-MchoseG75-Linux-Qt6
          path: |
            OpenRGBMchoseG75WiredPlugin.so
            OpenRGBMchoseG75WirelessPlugin.so
            OpenRGBMchoseG75Plugin.so

  build-linux-qt5:
    name: Build Linux Plugins (Qt 5 .so)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout OpenRGB Headers & Submodules
        run: |
          git clone --recursive --depth 1 https://github.com/CalcProgrammer1/OpenRGB.git openrgb_src

      - name: Install Build Dependencies (Qt 5)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qtbase5-dev qttools5-dev-tools libhidapi-dev

      - name: Build Plugins Shared Libraries
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)

      - name: Copy Linux Plugins (Qt5)
        run: |
          cp build/OpenRGBMchoseG75WiredPlugin.so OpenRGBMchoseG75WiredPlugin-Qt5.so
          cp build/OpenRGBMchoseG75WirelessPlugin.so OpenRGBMchoseG75WirelessPlugin-Qt5.so
          cp build/OpenRGBMchoseG75Plugin.so OpenRGBMchoseG75Plugin-Qt5.so

      - name: Upload Linux Qt5 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-MchoseG75-Linux-Qt5
          path: |
            OpenRGBMchoseG75WiredPlugin-Qt5.so
            OpenRGBMchoseG75WirelessPlugin-Qt5.so
            OpenRGBMchoseG75Plugin-Qt5.so

  build-windows:
    name: Build Windows Plugins (.dll)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout OpenRGB Headers & Submodules
        run: |
          git clone --recursive --depth 1 https://github.com/CalcProgrammer1/OpenRGB.git openrgb_src

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Build Plugins Dynamic Libraries
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Copy Windows Plugins
        shell: bash
        run: |
          cp build/Release/OpenRGBMchoseG75WiredPlugin.dll OpenRGBMchoseG75WiredPlugin.dll
          cp build/Release/OpenRGBMchoseG75WirelessPlugin.dll OpenRGBMchoseG75WirelessPlugin.dll
          cp build/Release/OpenRGBMchoseG75Plugin.dll OpenRGBMchoseG75Plugin.dll

      - name: Upload Windows Plugins Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-MchoseG75-Windows
          path: |
            OpenRGBMchoseG75WiredPlugin.dll
            OpenRGBMchoseG75WirelessPlugin.dll
            OpenRGBMchoseG75Plugin.dll

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux-qt6, build-linux-qt5, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Qt6 Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenRGB-MchoseG75-Linux-Qt6
          path: release_assets

      - name: Download Linux Qt5 Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenRGB-MchoseG75-Linux-Qt5
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenRGB-MchoseG75-Windows
          path: release_assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
